apply plugin: 'com.google.devtools.ksp'

dependencies {
    implementation project(':Data')
    implementation project(':HackWars')
    implementation project(':Networking')
    implementation project(':RpcDispatchAnnotations')
    ksp project(':RpcDispatchKsp')
    implementation 'org.apache.axis:axis:1.4'
    implementation 'org.antlr:antlr-runtime:3.0.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    implementation 'com.miglayout:miglayout-swing:11.4.2'
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:2.1.21"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
}

sourceSets {
    main {
        java {
            exclude 'com/hackwars/rpc/**'
        }
        kotlin {
            exclude 'com/hackwars/rpc/**'
        }
    }
    test {
        java.setSrcDirs(['test'])
        kotlin.setSrcDirs(['test'])
        resources.setSrcDirs([])
    }
}

tasks.register('runHackerServer', JavaExec) {
    group = 'application'
    description = 'Runs server.HackerServer with server id 1.'
    dependsOn tasks.named('classes'), project(':HackWars').tasks.named('classes')
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(rootProject.ext.javaToolchainVersion as Integer)
    }
    classpath = files(
            sourceSets.main.output,
            project(':HackWars').sourceSets.main.output,
            sourceSets.main.runtimeClasspath,
            rootProject.ext.resourcesRootDir
    )
    mainClass = 'server.HackerServerKt'
    args '1'
    workingDir = rootProject.ext.resourcesRootDir
}

tasks.withType(Test).configureEach {
    jvmArgs '-Dnet.bytebuddy.experimental=true'
}
