apply from: "${rootDir}/src/RewriteBuildLogic/gradle/rewrite-application.gradle"

description = 'Deterministic local dev launcher for the rewrite Swing client.'

application {
    mainClass = 'com.hackwars.rewrite.clientdev.RewriteClientDevKt'
}

repositories {
    ivy {
        name = 'PlayFabGitHubRaw'
        url = uri('https://raw.githubusercontent.com/PlayFab/JavaSDK')
        patternLayout {
            artifact '/versioned/builds/[artifact]-[revision].[ext]'
        }
        metadataSources {
            artifact()
        }
        content {
            includeModule('com.playfab', 'client-sdk')
        }
    }
}

dependencies {
    implementation project(':RewriteClient')
    implementation project(':RewriteClientModel')
    implementation project(':RewriteGameCore')
    implementation project(':RewriteGameServer')
    implementation project(':RewriteTestKit')
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
}
